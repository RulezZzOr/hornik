<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>OpenMinerOS</title>
    <style>
      :root {
        color-scheme: light dark;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: #111827;
        color: #f9fafb;
      }
      body {
        margin: 0;
      }
      main {
        max-width: 960px;
        margin: 0 auto;
        padding: 32px 20px;
      }
      h1 {
        margin: 0 0 8px;
        font-size: 32px;
        letter-spacing: 0;
      }
      .grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
        gap: 12px;
        margin-top: 24px;
      }
      .card {
        border: 1px solid #374151;
        border-radius: 8px;
        padding: 16px;
        background: #1f2937;
      }
      .label {
        color: #9ca3af;
        font-size: 13px;
        margin-bottom: 6px;
      }
      .value {
        font-size: 22px;
        font-weight: 700;
      }
      code {
        color: #a7f3d0;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>OpenMinerOS</h1>
      <p>Local development status for build <code>0.1.0</code>.</p>
      <section class="grid">
        <div class="card">
          <div class="label">State</div>
          <div id="state" class="value">loading</div>
        </div>
        <div class="card">
          <div class="label">Board</div>
          <div id="board" class="value">loading</div>
        </div>
        <div class="card">
          <div class="label">Hashrate</div>
          <div id="hashrate" class="value">loading</div>
        </div>
        <div class="card">
          <div class="label">Contribution</div>
          <div id="contribution" class="value">loading</div>
        </div>
      </section>
    </main>
    <script>
      async function refresh() {
        const [info, health, miner, contribution] = await Promise.all([
          fetch("/api/v1/system/info").then((r) => r.json()),
          fetch("/api/v1/system/health").then((r) => r.json()),
          fetch("/api/v1/miner/status").then((r) => r.json()),
          fetch("/api/v1/contribution/status").then((r) => r.json()),
        ]);
        document.querySelector("#state").textContent = health.state;
        document.querySelector("#board").textContent = `${info.model} / ${info.board_family}`;
        document.querySelector("#hashrate").textContent = `${miner.hashrate_ths.toFixed(1)} TH/s`;
        document.querySelector("#contribution").textContent = `${contribution.rate_percent.toFixed(1)}%`;
      }
      refresh();
      setInterval(refresh, 5000);
    </script>
  </body>
</html>
